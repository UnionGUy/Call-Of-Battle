<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call of Battle 3D - Starter FPS</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 16px; height: 16px;
      margin: -8px 0 0 -8px;
      border: 2px solid #00ff88; border-radius: 50%;
      pointer-events: none;
    }
    #hud {
      position: absolute; top: 15px; left: 20px;
      color: #fff; font-size: 20px; font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
    #instructions {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.75); color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; text-align: center;
    }
  </style>
</head>
<body>
  <div id="hud">KILLS: <span id="score">0</span> | HP: <span id="hp">100</span></div>
  <div id="crosshair"></div>
  <div id="instructions">
    <h1>CALL OF BATTLE 3D</h1>
    <p>Click anywhere to deploy</p>
    <p>WASD = Move | Space = Jump | Mouse = Aim | Left Click = Shoot</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 10, 120);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // Ground
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x4a5d23 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Battlefield Cover Crates & Walls
    const obstacles = [];
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
    for (let i = 0; i < 25; i++) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), boxMat);
      box.position.set((Math.random() - 0.5) * 140, 1.5, (Math.random() - 0.5) * 140);
      if (box.position.length() > 10) {
        scene.add(box);
        obstacles.push(box);
      }
    }

    // Gun Model attached to Camera
    const gun = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.18, 0.7),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    gun.position.set(0.3, -0.25, -0.5);
    camera.add(gun);
    scene.add(camera);

    // Pointer Lock & Look Controls
    const instructions = document.getElementById('instructions');
    let isLocked = false;
    let yaw = 0, pitch = 0;

    instructions.addEventListener('click', () => document.body.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      instructions.style.display = isLocked ? 'none' : 'flex';
    });

    document.addEventListener('mousemove', e => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch - e.movementY * 0.002));
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    // Movement & Shooting
    const keys = {};
    let velocityY = 0, canJump = true, score = 0, hp = 100;
    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    const bullets = [];
    const enemies = [];

    document.addEventListener('mousedown', () => {
      if (!isLocked || hp <= 0) return;
      gun.position.z = -0.38; // Recoil kick
      setTimeout(() => gun.position.z = -0.5, 80);

      const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.1),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
      );
      bullet.position.copy(camera.position);
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      bullet.userData.vel = dir.multiplyScalar(1.8);
      scene.add(bullet);
      bullets.push(bullet);
    });

    function spawnEnemy() {
      if (hp <= 0) return;
      const enemy = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.6, 1.5, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0xcc2222 })
      );
      const angle = Math.random() * Math.PI * 2;
      enemy.position.set(Math.cos(angle) * 55, 1.35, Math.sin(angle) * 55);
      scene.add(enemy);
      enemies.push(enemy);
    }
    setInterval(spawnEnemy, 2000);

    // Game Loop
    function animate() {
      requestAnimationFrame(animate);
      if (isLocked && hp > 0) {
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const speed = 0.22;

        if (keys['KeyW']) camera.position.addScaledVector(forward, speed);
        if (keys['KeyS']) camera.position.addScaledVector(forward, -speed);
        if (keys['KeyA']) camera.position.addScaledVector(right, -speed);
        if (keys['KeyD']) camera.position.addScaledVector(right, speed);

        if (keys['Space'] && canJump) { velocityY = 0.28; canJump = false; }
        camera.position.y += velocityY;
        velocityY -= 0.015;
        if (camera.position.y <= 2) { camera.position.y = 2; velocityY = 0; canJump = true; }

        // Bullets update
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.userData.vel);
          if (b.position.distanceTo(camera.position) > 120) {
            scene.remove(b); bullets.splice(i, 1); continue;
          }
          for (let j = enemies.length - 1; j >= 0; j--) {
            if (b.position.distanceTo(enemies[j].position) < 1.3) {
              scene.remove(enemies[j]); enemies.splice(j, 1);
              scene.remove(b); bullets.splice(i, 1);
              score++; document.getElementById('score').textContent = score;
              break;
            }
          }
        }

        // Enemies update
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          const toPlayer = new THREE.Vector3().subVectors(camera.position, en.position);
          toPlayer.y = 0;
          if (toPlayer.length() < 1.8) {
            hp -= 10; document.getElementById('hp').textContent = hp;
            scene.remove(en); enemies.splice(i, 1);
            if (hp <= 0) alert('GAME OVER! Refresh to play again.');
          } else {
            toPlayer.normalize();
            en.position.addScaledVector(toPlayer, 0.09);
          }
        }
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
