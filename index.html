<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call of Battle - Starter Clone</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background: #2b303a;
      border: 3px solid #4a5568;
      cursor: crosshair;
    }
    #hud {
      margin-bottom: 10px;
      font-size: 18px;
      display: flex;
      gap: 30px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>Health: <span id="hp">100</span></div>
    <div>Score: <span id="score">0</span></div>
    <div>Controls: WASD to Move | Click to Shoot</div>
  </div>
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const hpEl = document.getElementById("hp");
    const scoreEl = document.getElementById("score");

    let score = 0;
    let gameOver = false;

    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      speed: 4,
      hp: 100,
      angle: 0
    };

    const keys = {};
    const bullets = [];
    const enemies = [];

    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
    });

    canvas.addEventListener("mousedown", () => {
      if (gameOver) return;
      bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        vx: Math.cos(player.angle) * 8,
        vy: Math.sin(player.angle) * 8,
        radius: 4
      });
    });

    function spawnEnemy() {
      if (gameOver) return;
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * canvas.width; y = -20; }
      else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
      else { x = -20; y = Math.random() * canvas.height; }

      enemies.push({ x, y, radius: 14, speed: 1.8 });
    }

    setInterval(spawnEnemy, 1200);

    function update() {
      if (gameOver) return;

      // Player movement
      if (keys["w"] && player.y > player.radius) player.y -= player.speed;
      if (keys["s"] && player.y < canvas.height - player.radius) player.y += player.speed;
      if (keys["a"] && player.x > player.radius) player.x -= player.speed;
      if (keys["d"] && player.x < canvas.width - player.radius) player.x += player.speed;

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        const angle = Math.atan2(player.y - en.y, player.x - en.x);
        en.x += Math.cos(angle) * en.speed;
        en.y += Math.sin(angle) * en.speed;

        // Hit player
        const distPlayer = Math.hypot(player.x - en.x, player.y - en.y);
        if (distPlayer < player.radius + en.radius) {
          player.hp -= 10;
          hpEl.textContent = player.hp;
          enemies.splice(i, 1);
          if (player.hp <= 0) gameOver = true;
          continue;
        }

        // Hit by bullet
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - en.x, b.y - en.y) < en.radius + b.radius) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 10;
            scoreEl.textContent = score;
            break;
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Player
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.fillStyle = "#48bb78";
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#cbd5e0";
      ctx.fillRect(0, -4, 22, 8); // Gun barrel
      ctx.restore();

      // Draw Bullets
      ctx.fillStyle = "#f6e05e";
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Enemies
      ctx.fillStyle = "#f56565";
      enemies.forEach(en => {
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER - Refresh to Restart", canvas.width / 2, canvas.height / 2);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
